name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Python split and augmentation checks
        run: |
          python -m pip install --disable-pip-version-check numpy
          PYTHONPATH=training python -m unittest training.test_augment training.test_splits training.test_asl_signs training.test_sources training.test_features_rich training.test_letter_split

      - name: Build
        run: npm run build

      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb

      - name: End-to-end
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: GitHub Pages build
        run: |
          npm run build
          grep -q '/sign-bridge/assets/' dist/index.html
          grep -q '/sign-bridge/models/' dist/sw.js
        env:
          GITHUB_PAGES: 'true'
